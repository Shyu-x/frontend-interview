site_name: 前端面试全家桶
site_description: 面向前端工程师的中文系统化教程：从 JavaScript、TypeScript、浏览器、网络到 React/Vue、工程化、性能优化、API 设计、WebAssembly 与 AI Agent，每页都有图解、分步讲解、可运行代码与自测题。
site_author: Shyu-x
site_url: https://shyu-x.github.io/frontend-interview

repo_name: frontend-interview
repo_url: https://github.com/Shyu-x/frontend-interview
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式

  font:
    text: "Inter"
    code: "JetBrains Mono"
    fallback: true

  icon:
    repo: fontawesome/brands/github
    logo: material/book-open-page-variant-outline
    annotate: material/sticky-note-outline

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.prune
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

