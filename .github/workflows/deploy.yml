name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-mermaid:
    name: Validate Mermaid Diagrams (Strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Mermaid validation
        run: node scripts/validate-mermaid.js docs --strict

  build:
    runs-on: ubuntu-latest
    needs: validate-mermaid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Build site
        run: |
          uv run mkdocs build --clean > build.log 2>&1 || { cat build.log; exit 1; }
          LINK_WARNINGS=$(grep -c "contains a link" build.log || echo "0")
          if [ "$LINK_WARNINGS" -gt 0 ]; then
            echo "✗ Build has $LINK_WARNINGS link warning(s)"
            grep "contains a link" build.log | head -5
            exit 1
          fi
          echo "✓ Build successful with 0 link warnings"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4