name: Verify documentation

on:
  push:
    branches: [main, develop]
    paths: ["docs/**", "scripts/**", "mkdocs.yml", ".github/workflows/*.yml"]
  pull_request:
    paths: ["docs/**", "scripts/**", "mkdocs.yml", ".github/workflows/*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Metadata gate for new and modified pages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Audit legacy debt with --all; every edited page must comply.
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check-doc-frontmatter.py --base "$BASE_SHA"
          else
            python3 scripts/check-doc-frontmatter.py --base HEAD~1
          fi
      - run: python3 scripts/check-tables.py
      - run: python3 scripts/fix-lists.py
      - run: node scripts/validate-mermaid.js docs --strict
      - name: Build all pages and validate site links
        run: uv run mkdocs build --strict --clean
