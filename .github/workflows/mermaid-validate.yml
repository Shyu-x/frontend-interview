name: Validate Mermaid Diagrams

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**/*.md'
      - 'scripts/validate-mermaid.js'
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'scripts/validate-mermaid.js'

jobs:
  validate-mermaid:
    name: Validate Mermaid Diagrams
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Mermaid validation
        run: node scripts/validate-mermaid.js docs

  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint "docs/**/*.md" \
            --disable MD013 MD032 MD033 MD041 MD051 MD060 \
            --ignore "**/node_modules/**" \
            --ignore "**/site/**"