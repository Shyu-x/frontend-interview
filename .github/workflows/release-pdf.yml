name: Release PDF Books

# 不随每次 push 触发：整套分册耗时较长。
# 手动触发，或推送形如 books-2026.10 的标签时发布；PDF 作为 Release 附件上传。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签，例如 books-2026.10"
        required: true
  push:
    tags:
      - "books-*"

permissions:
  contents: write

jobs:
  books:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: book/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build site (book input)
        run: |
          pip install uv
          uv sync
          npm ci --prefix book
          node book/scripts/sync-fonts.mjs
          uv run mkdocs build --clean

      - name: Merge fonts for PDF
        run: |
          python3 -m venv .venv-fonts
          .venv-fonts/bin/pip install fonttools brotli
          .venv-fonts/bin/python book/scripts/merge-fonts.py

      - name: Build volumes
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node book/build.mjs

      - name: Verify PDFs (page size, duplicate pages, TOC numbers)
        run: |
          for f in book/dist/frontend-interview-*.pdf; do node book/scripts/verify-pdf.mjs "$f" || exit 1; done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "前端面试全家桶 PDF 分册 $TAG" --notes-file book/dist/RELEASE_NOTES.md
          gh release edit "$TAG" --title "前端面试全家桶 PDF 分册 $TAG" --notes-file book/dist/RELEASE_NOTES.md
          # 先清掉旧附件（旧版本用过 vol01.pdf 之类的名字），再上传；文件名用英文，下载页显示中文标签
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r name; do gh release delete-asset "$TAG" "$name" -y; done
          node -e '
            const v = JSON.parse(require("fs").readFileSync("book/dist/volumes.json", "utf8"));
            for (const b of v) console.log(`book/dist/${b.file}#${b.label}`);
          ' | while read -r spec; do gh release upload "$TAG" "$spec"; done
