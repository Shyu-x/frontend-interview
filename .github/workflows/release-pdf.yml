name: Release PDF Books

# 不随每次 push 触发：整套分册耗时较长。
# 手动触发，或推送形如 books-2026.10 的标签时发布；PDF 作为 Release 附件上传。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签，例如 books-2026.10"
        required: true
  push:
    tags:
      - "books-*"

permissions:
  contents: write

jobs:
  books:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: book/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build site (book input)
        run: |
          pip install uv
          uv sync
          npm ci --prefix book
          node book/scripts/sync-fonts.mjs
          uv run mkdocs build --clean

      - name: Merge fonts for PDF
        run: |
          python3 -m venv .venv-fonts
          .venv-fonts/bin/pip install fonttools brotli
          .venv-fonts/bin/python book/scripts/merge-fonts.py

      - name: Build volumes
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node book/build.mjs

      - name: Verify PDFs (page size, duplicate pages, TOC numbers)
        run: |
          for f in book/dist/vol*.pdf; do node book/scripts/verify-pdf.mjs "$f" || exit 1; done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "前端面试全家桶 · 分册 PDF（16 开，185×260mm）。分册规则见 book/volumes.mjs。"
          gh release upload "$TAG" book/dist/vol*.pdf --clobber
